<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Part 2 Analysis | The Church Below the Sea</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

</head>


<body>


  <!-- =========================
       TOEIC Part 2 Analysis
  ========================= -->

  <main class="part2-analysis">


    <!-- =========================
         タイトル
    ========================= -->

    <h1>
      PART 2 ANALYSIS
    </h1>


    <p class="analysis-subtitle">
      The sea reveals what you have yet to master.
    </p>


    <!-- =========================
         総合成績
    ========================= -->

    <section class="analysis-summary">


      <!-- Total -->

      <div class="analysis-card">

        <span class="analysis-label">
          TOTAL
        </span>

        <strong id="totalQuestions">
          0
        </strong>

        <span>
          questions
        </span>

      </div>


      <!-- Accuracy -->

      <div class="analysis-card">

        <span class="analysis-label">
          ACCURACY
        </span>

        <strong id="accuracy">
          0%
        </strong>

      </div>


      <!-- Average Time -->

      <div class="analysis-card">

        <span class="analysis-label">
          AVG. TIME
        </span>

        <strong id="averageTime">
          0.0
        </strong>

        <span>
          sec
        </span>

      </div>


    </section>


    <!-- =========================
         問題タイプ別分析
    ========================= -->

    <section class="analysis-section">


      <h2>
        QUESTION TYPE
      </h2>


      <div
        id="typeAnalysis"
        class="type-analysis"
      >
      </div>


    </section>


    <!-- =========================
         弱点分析
    ========================= -->

    <section
      class="analysis-section weakness-section"
    >


      <h2>
        YOUR WEAKNESS
      </h2>


      <div
        id="weakness"
        class="weakness"
      >
      </div>


    </section>


    <!-- =========================
         ボタン
    ========================= -->

    <div class="analysis-actions">


      <!-- Part 2へ戻る -->

      <a
        href="../part2.html"
        class="analysis-button"
      >
        PRACTICE PART 2
      </a>


      <!-- 記録リセット -->

      <button
        id="resetPerformance"
        class="analysis-button reset-button"
      >
        RESET RECORD
      </button>


    </div>


  </main>


  <!-- =========================
       JavaScript
  ========================= -->

  <script
    src="../quizjs/part2-analysis.js"
  ></script>


</body>

</html>
