<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Red Drop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #9ee8f5;
    }

    .water {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255,255,255,0.25),
          transparent 50%
        ),
        #9ee8f5;
    }

    /* 赤い一滴 */
    .drop {
      position: absolute;
      top: -80px;
      left: 50%;

      width: 35px;
      height: 70px;

      transform: translateX(-50%);

      background: #d9364f;
      border-radius: 50% 50% 55% 55%;

      filter: blur(1px);

      animation: fall 2s ease-in forwards;
    }

    /* 落下 */
    @keyframes fall {
      0% {
        top: -80px;
        transform: translateX(-50%) scale(0.8);
      }

      80% {
        top: 45%;
        transform: translateX(-50%) scale(1);
      }

      100% {
        top: 48%;
        transform: translateX(-50%) scale(0);
      }
    }

    /* 赤い液体が広がる */
    .ink {
      position: absolute;
      top: 48%;
      left: 50%;

      width: 30px;
      height: 30px;

      transform: translate(-50%, -50%);

      background: #d9364f;
      border-radius: 50%;

      filter: blur(8px);

      animation: spread 5s ease-out 1.6s forwards;
    }

    @keyframes spread {
      0% {
        width: 20px;
        height: 20px;
        opacity: 0.9;
      }

      30% {
        width: 180px;
        height: 220px;
        opacity: 0.75;
      }

      60% {
        width: 400px;
        height: 500px;
        opacity: 0.45;
      }

      100% {
        width: 900px;
        height: 900px;
        opacity: 0;
      }
    }

    /* ふわふわした赤い煙 */
    .cloud {
      position: absolute;
      top: 48%;
      left: 50%;

      width: 80px;
      height: 80px;

      transform: translate(-50%, -50%);

      background: #e04458;
      border-radius: 50%;

      filter: blur(25px);

      animation: cloudSpread 6s ease-out 1.8s forwards;
    }

    @keyframes cloudSpread {
      0% {
        transform:
          translate(-50%, -50%)
          scale(0.5)
          rotate(0deg);

        opacity: 0.7;
      }

      50% {
        transform:
          translate(-45%, -55%)
          scale(3)
          rotate(30deg);

        opacity: 0.45;
      }

      100% {
        transform:
          translate(-55%, -45%)
          scale(8)
          rotate(90deg);

        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="water">

    <div class="drop"></div>

    <div class="ink"></div>

    <div class="cloud"></div>

  </div>

</body>
</html>
